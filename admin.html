<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131d" />
    <title>ONU Tec | Administração</title>
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <main class="admin-shell">
      <aside class="sidebar">
        <a class="admin-brand" href="index.html"><img src="public/onu-tec.png" alt="Símbolo ONU Tec" /><span>ONU TEC<small>ADMINISTRAÇÃO</small></span></a>
        <nav aria-label="Navegação administrativa">
          <button class="nav-item active" data-page="overview" type="button"><span>◉</span> Visão geral</button>
          <button class="nav-item" data-page="registrations" type="button"><span>▤</span> Inscrições</button>
          <button class="nav-item" data-page="slots" type="button"><span>◇</span> Vagas</button>
          <button class="nav-item" data-page="committees" type="button"><span>⌘</span> Comitês</button>
        </nav>
        <div class="sidebar-bottom"><img src="public/escola-logo.png" alt="Logo da Etec Dr. Domingos Minicucci Filho" /><span>Organização<br />ONU Tec 2026</span></div>
      </aside>

      <section class="admin-content">
        <header class="admin-topbar">
          <button class="menu-button" type="button" aria-label="Abrir menu" data-action="menu">☰</button>
          <div><p class="eyebrow">CENTRAL DE ORGANIZAÇÃO</p><h1 id="page-title">Visão geral</h1></div>
          <div class="admin-user"><span>RR</span><div><strong>Organização</strong><small>Administrador</small></div></div>
        </header>

        <section class="toolbar"><div class="period-toggle" role="group" aria-label="Filtrar período"><button class="active" data-period="Manhã" type="button">Manhã</button><button data-period="Tarde" type="button">Tarde</button></div><div class="toolbar-actions"><button class="export-button" type="button" data-action="export">Exportar Excel</button><button class="new-button" type="button" data-action="new-registration">+ Nova inscrição</button></div></section>
        <section id="admin-stage" aria-live="polite"></section>
      </section>
    </main>
    <dialog id="admin-dialog" class="admin-dialog"><button class="dialog-close" type="button" data-action="close-dialog" aria-label="Fechar">×</button><div id="dialog-content"></div></dialog>
    <script src="admin.js"></script>
  </body>
</html>
