<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10131d" />
    <meta name="description" content="Consulta pública do resultado da ONU Tec 2026." />
    <title>ONU Tec | Consulta 2026</title>
    <link rel="icon" type="image/png" href="assets/onu-tec.png" />
    <link rel="apple-touch-icon" href="assets/onu-tec.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#app">Ir para a consulta</a>
    <main id="app" class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="ONU Tec, início">
          <img src="assets/onu-tec.png" alt="Símbolo ONU Tec" />
          <span>ONU TEC<small>CONSULTA 2026</small></span>
        </a>
        <button class="info-button" type="button" aria-label="Sobre a consulta" data-action="help">?</button>
      </header>

      <section class="stage" id="stage" aria-live="polite"></section>
    </main>

    <aside class="corner-mark" aria-label="Etec Dr. Domingos Minicucci Filho">
      <img src="assets/escola-logo.png" alt="Logo da Etec Dr. Domingos Minicucci Filho" />
    </aside>

    <dialog id="help-dialog" class="dialog">
      <button class="dialog-close" type="button" aria-label="Fechar" data-action="close-help">×</button>
      <p class="eyebrow">COMO FUNCIONA</p>
      <h2>Consulta encerrada.</h2>
      <p>Este site exibe apenas o retrato final das delegações. Não é possível criar, editar ou alterar inscrições.</p>
      <button class="button primary" type="button" data-action="close-help">Entendi</button>
    </dialog>

    <script src="inscricoes.js"></script>
    <script src="consulta.js"></script>
  </body>
</html>
